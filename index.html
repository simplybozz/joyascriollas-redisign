<!doctype html>
<html lang="es-DO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b08" />
    <title>Joyas Criollas: Ámbar y Larimar dominicano desde 1979</title>
    <meta
      name="description"
      content="Joyería familiar dominicana en ámbar, larimar y artesanía criolla desde 1979. Tienda y museo en Ensanche El Vergel, Santo Domingo."
    />
    <meta property="og:title" content="Joyas Criollas: Ámbar y Larimar dominicano desde 1979" />
    <meta
      property="og:description"
      content="Joyería familiar dominicana en ámbar, larimar y artesanía criolla desde 1979. Tienda y museo en Ensanche El Vergel, Santo Domingo."
    />
    <meta property="og:type" content="website" />

    <!--
      Pantalla de carga: inline y sin depender del bundle de Vue, para que
      aparezca de inmediato (cubre el instante antes de que la app monte)
      y se retire con un fundido suave una vez todo está listo.
    -->
    <style>
      /* .app-loader es una clase (no solo el id del div inicial) para que
         la misma pantalla de carga se reutilice al navegar entre páginas
         dentro de la app (ver App.vue), igual que en el rediseño de
         EGEMERD, donde cada página muestra su propio loader al cargar. */
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0b08;
        transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.7s;
      }
      .app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-loader-mark {
        position: relative;
        width: 56px;
        height: 56px;
      }
      .app-loader-ring {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid rgba(245, 239, 227, 0.14);
        border-top-color: #c9a15a;
        animation: app-loader-spin 0.9s linear infinite;
      }
      .app-loader-mark::after {
        content: '';
        position: absolute;
        inset: 16px;
        border-radius: 50%;
        background: #c9a15a;
        opacity: 0.9;
        animation: app-loader-pulse 1.7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes app-loader-pulse {
        0%,
        100% {
          transform: scale(0.55);
          opacity: 0.55;
        }
        50% {
          transform: scale(1);
          opacity: 0.95;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loader" class="app-loader" aria-hidden="true">
      <div class="app-loader-mark"><div class="app-loader-ring"></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
